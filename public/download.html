<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyShare - Download</title>
  <link href="/css/app.css" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="/img/favicon/favicon.ico">
</head>

<div class="navbar bg-base-100 shadow-sm">
  <div class="navbar-start">
    <a href="/"> <img class="" src="/img/myshare_white.png" style="height: 64px; width: 64px;"> </a>
  </div>
  <div class="navbar-end">
    <ul class="menu menu-horizontal px-1">
      <li><a onclick="location.href='/download.html';">Download</a></li>
    </ul>
    <div class="dropdown dropdown-end">
      <div tabindex="0" role="button" class="btn btn-ghost btn-circle avatar">
        <div class="w-14 rounded-full">
          <img src="/img/default.png" />
        </div>
      </div>
      <ul tabindex="0" class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow">
        <li> <a href="/login.html" id="dd-login" class="justify-between">Login</a> </li>
        <li><a id="dd-dashboard" href="/dashboard.html">Dashboard</a></li>
        <li><a id="dd-logout" onClick="logout()">Logout</a></li>
        <div class="divider m-0"></div>
        <input type="radio" name="theme-dropdown" class="theme-controller btn btn-sm btn-ghost justify-start"
          aria-label="Dark" value="default" />
        <input type="radio" name="theme-dropdown" class="theme-controller btn btn-sm btn-ghost justify-start"
          aria-label="Light" value="light" />
      </ul>
    </div>
  </div>
</div>


<div class="hero bg-base-200 min-h-screen">
  <div class="card card-border bg-base-300 w-100 border-base-100 shadow-xl">
    <div class="card-body card-border">
      <div class="container"
        style="display: grid;align-items: center; grid-template-columns: 1fr 1fr 1fr;column-gap: 2px;">
        <h2 class="text-2xl font-bold py-2">Downloads</h2>
      </div>
      <br>
      <div class="divider"></div>
      <p2 class="text-center">There are no downloadable versions of MyShare right now.</p2>
    </div>
  </div>
</div>
<footer class="footer footer-horizontal footer-center bg-base-300 text-base-content rounded p-10">
  <nav class="grid grid-flow-col">
    <a class="link link-hover" href="/contact.html">Contact</a>

    <a class="link link-hover" href="/privacy.html">Privacy Policy</a>
    <a class="link link-hover" href="https://github.com/byeoon/MyShare">GitHub</a>
  </nav>
  <p class="p-0">Copyright © 2025-2026 MyShare All right reserved</p>
</footer>

</html>

<script>
  function logout() {
    localStorage.removeItem("token");
    localStorage.removeItem("userId");
    window.location.href = "/";
  }
</script>
