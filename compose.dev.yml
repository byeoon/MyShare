services:
    frontend:
        build:
            context: ./frontend
            dockerfile: dev.Dockerfile

        ports:
            - '5173:5173'

        volumes:
            - ./frontend:/app
            - frontend_node_modules:/app/node_modules

    backend:
        build:
            context: ./backend
            dockerfile: dev.Dockerfile

        ports:
            - '8000:8000'

        volumes:
            - ./backend:/app
            - backend_node_modules:/app/node_modules

        environment:
            NODE_ENV: development
            PORT: 8000

volumes:
    frontend_node_modules:
    backend_node_modules:
