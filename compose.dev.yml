services:
    frontend:
        build:
            context: ./frontend
            dockerfile: dev.Dockerfile

        ports:
            - '5173:5173'

        volumes:
            - ./frontend:/app
            - frontend_node_modules:/app/node_modules

    backend:
        build:
            context: ./backend
            dockerfile: dev.Dockerfile

        ports:
            - '8000:8000'

        depends_on:
            db:
                condition: service_healthy

        volumes:
            - ./backend:/app
            - backend_node_modules:/app/node_modules

        environment:
            NODE_ENV: development
            PORT: 8000
            DB_HOST: db
            DB_PORT: 3306
            DB_USERNAME: mariadb
            DB_PASSWORD: MakeASecurePassword999!
            DATABASE: myshare
            JWT_SECRET: supersecret_myshare_revival_jwt_key_2026!

volumes:
    frontend_node_modules:
    backend_node_modules:
