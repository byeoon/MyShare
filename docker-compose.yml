services:
  app:
    build: .
    ports:
      - "3010:3010"
    env_file: .env
    environment:
      - NODE_ENV=production
      - DB_HOST=db
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.2
    environment:
      MARIADB_DATABASE: myshare
      MARIADB_USER: mariadb
      MARIADB_PASSWORD: MakeASecurePassword999!
      MARIADB_ROOT_PASSWORD: root_password_here
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./setup_database.sql:/docker-entrypoint-initdb.d/setup_database.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mariadb_data:
