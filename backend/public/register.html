<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>MyShare - Register</title>
        <link href="/css/app.css" rel="stylesheet" />
        <link rel="icon" type="image/x-icon" href="/img/favicon/favicon.ico" />
    </head>

    <div
        class="hero bg-base-200 min-h-screen flex flex-col justify-center items-center p-4 relative overflow-hidden"
        id="bg"
    >
        <div
            class="pointer-events-none absolute inset-0 opacity-75 transition-opacity duration-300 z-0"
            style="
                background: radial-gradient(
                    600px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
                    rgba(30, 33, 189, 0.22),
                    transparent 60%
                );
            "
        ></div>

        <div class="flex flex-col gap-4 items-center relative z-10">
            <div
                class="card card-border bg-base-300/80 backdrop-blur-2xl border-base-100 w-96 shadow-xl"
            >
                <div class="card-body">
                    <div
                        class="container"
                        style="
                            display: grid;
                            align-items: center;
                            grid-template-columns: 1fr 1fr 1fr;
                            column-gap: 2px;
                            padding: 8px;
                        "
                    >
                        <img src="/img/myshare_white.png" style="height: 64px; width: 64px" />
                        <h2 class="text-2xl font-bold py-2">Register</h2>
                    </div>

                    <input
                        id="email"
                        type="email"
                        placeholder="Email"
                        class="input validator input-bordered p-4 mt-2 bg-base-200/60 backdrop-blur-sm"
                    />
                    <input
                        id="username"
                        placeholder="Username"
                        class="input input-bordered p-4 mt-2 bg-base-200/60 backdrop-blur-sm"
                    />
                    <input
                        id="pw"
                        type="password"
                        placeholder="Password"
                        class="input input-bordered p-4 mt-2 bg-base-200/60 backdrop-blur-sm"
                    />

                    <label
                        class="fieldset-label flex items-center gap-2 cursor-pointer mt-2 text-sm text-base-content/80"
                    >
                        <input
                            type="checkbox"
                            class="checkbox checkbox-primary checkbox-sm"
                            id="tosCheckbox"
                        />
                        I agree to MyShare's TOS
                    </label>

                    <button
                        class="btn btn-primary mt-4 shadow-lg shadow-primary/20"
                        style="padding: 20px"
                        id="register"
                        onClick="postToServer()"
                    >
                        Create Account
                    </button>
                    <div class="divider"></div>
                    <p2 class="text-center"
                        >Already have an account? <a class="link" href="/login.html">Login!</a></p2
                    >
                </div>
            </div>
        </div>
    </div>
</html>

<script>
    const bg = document.getElementById('bg');
    if (bg) {
        bg.addEventListener('mousemove', (e) => {
            const rect = bg.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            bg.style.setProperty('--mouse-x', `${x}px`);
            bg.style.setProperty('--mouse-y', `${y}px`);
        });
    }

    var input = document.getElementById('pw');
    if (input) {
        input.addEventListener('keypress', function (event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                document.getElementById('register').click();
            }
        });
    }

    async function getRegistrationStatus() {
        try {
            const response = await fetch('/api/getregistrationstatus', {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                },
            });
            if (!response.ok) {
                window.location.href = '/login.html';
            }
        } catch (error) {
            console.log('Error checking registration status');
        }
    }
    getRegistrationStatus();

    async function postToServer() {
        const email = document.getElementById('email').value;
        const username = document.getElementById('username').value;
        const password = document.getElementById('pw').value;
        const tosChecked = document.getElementById('tosCheckbox').checked;

        if (!tosChecked) {
            alert('Make sure to read and accept the TOS before making an account.');
            return;
        }

        const userData = {
            email: email,
            username: username,
            password: password,
        };
        try {
            const response = await fetch('/api/users', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(userData),
            });

            alert('Please log in with your new credentials!');
            window.location.replace('/login.html');
        } catch (error) {
            console.error('err:', error);
            alert('There was an error while trying to make an account. Error: ' + error);
            window.location.replace('/register.html');
        }
    }
</script>
