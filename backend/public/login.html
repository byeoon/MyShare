<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>MyShare - Login</title>
        <link href="/css/app.css" rel="stylesheet" />
        <script src="../registerScript.js"></script>
        <link rel="icon" type="image/x-icon" href="/img/favicon/favicon.ico" />
    </head>

    <div
        class="hero bg-base-200 min-h-screen flex flex-col justify-center items-center p-4 relative overflow-hidden"
        id="bg"
    >
        <div
            class="pointer-events-none absolute inset-0 opacity-75 transition-opacity duration-300 z-0"
            style="
                background: radial-gradient(
                    600px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
                    rgba(30, 33, 189, 0.22),
                    transparent 60%
                );
            "
        ></div>

        <div class="flex flex-col gap-4 items-center relative z-10">
            <div
                class="card card-border bg-base-300/80 backdrop-blur-2xl border-base-100 w-96 shadow-xl"
            >
                <div class="card-body">
                    <div
                        class="container"
                        style="
                            display: grid;
                            align-items: center;
                            grid-template-columns: 1fr 1fr 1fr;
                            column-gap: 2px;
                            padding: 8px;
                        "
                    >
                        <img src="/img/myshare_white.png" style="height: 64px; width: 64px" />
                        <h2 class="text-2xl font-bold py-2">Login</h2>
                    </div>

                    <input
                        id="email"
                        placeholder="Email"
                        class="input input-bordered mt-2 bg-base-200/60 backdrop-blur-sm"
                    />
                    <input
                        id="pw"
                        type="password"
                        placeholder="Password"
                        class="input input-bordered p-4 mt-2 bg-base-200/60 backdrop-blur-sm"
                    />
                    <button
                        class="btn btn-primary mt-4 shadow-lg shadow-primary/20"
                        style="padding: 20px"
                        id="login"
                        type="submit"
                        onClick="postToServer()"
                    >
                        Login
                    </button>
                    <div id="registerDiv">
                        <div class="divider"></div>
                        <center>
                            <p2 class="text-center"
                                >Don't have an account?
                                <a class="link" href="/register.html">Register!</a>
                            </p2>
                        </center>
                    </div>
                    <p2 class="text-center"
                        ><a class="link" href="/recovery.html">Forgot credentials?</a></p2
                    >
                </div>
            </div>

            <div
                class="card card-border bg-base-300/80 backdrop-blur-xl border-base-100 w-96 shadow-xl"
            >
                <div class="flex justify-center space-x-8 py-2">
                    <div class="stat">
                        <div
                            class="stat-value text-center text-primary text-center"
                            id="totalUserValue"
                        >
                            0
                        </div>
                        <div
                            class="stat-title text-base-content/70 text-xs text-center font-medium"
                        >
                            Instance Users
                        </div>
                    </div>
                    <div class="stat">
                        <div
                            class="stat-value text-center text-primary text-center"
                            id="totalNotesValue"
                        >
                            0
                        </div>
                        <div
                            class="stat-title text-base-content/70 text-xs text-center font-medium"
                        >
                            Instance Uploads
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</html>
<script>
    const bg = document.getElementById('bg');
    if (bg) {
        bg.addEventListener('mousemove', (e) => {
            const rect = bg.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            bg.style.setProperty('--mouse-x', `${x}px`);
            bg.style.setProperty('--mouse-y', `${y}px`);
        });
    }

    var input = document.getElementById('pw');
    input.addEventListener('keypress', function (event) {
        if (event.key === 'Enter') {
            event.preventDefault();
            document.getElementById('login').click();
        }
    });

    fetch('/api/stats')
        .then((res) => res.json())
        .then((data) => {
            document.getElementById('totalUserValue').innerHTML = data.totalUsers;
            document.getElementById('totalNotesValue').innerHTML = data.totalNotes;
        });

    async function getRegistrationStatus() {
        try {
            const response = await fetch('/api/getregistrationstatus', {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                },
            });
            if (!response.ok) {
                document.getElementById('registerDiv').style.display = 'none';
            } else {
                // do nothing
            }
        } catch (error) {
            console.log('Error checking registration status');
        }
    }
    getRegistrationStatus();

    async function postToServer() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('pw').value;
        const userData = {
            email: email,
            password: password,
        };

        try {
            const response = await fetch('/api/users/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(userData),
            });

            if (!response.ok) {
                throw new Error('Err');
            }
            const data = await response.json();
            const token = data.token;

            localStorage.setItem('token', token); // KEEP THIS SAFE!
            window.location.replace('/dashboard.html');
        } catch (error) {
            console.error('err:', error);
            window.location.replace('/login.html');
            alert('error' + error);
        }
    }
</script>
